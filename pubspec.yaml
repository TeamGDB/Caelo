name: caelo
description: "A VPN client for subscription links."
publish_to: 'none'

version: 0.3.15+29

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  ffi: ^2.2.0
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  device_info_plus: ^13.3.0
  mobile_scanner: 7.4.2
  app_links: 7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  # Cupertino only — no Material widgets, so no Material icon font to ship.
  uses-material-design: false
  generate: true
  assets:
    - docs/caelo.png
  # Flags for Windows, which has none of its own (#168).
  fonts:
    - family: CaeloFlags
      fonts:
        - asset: assets/fonts/CaeloFlags.ttf
