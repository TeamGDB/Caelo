name: Core

on:
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml"]
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: core

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          test -z "$unformatted" || (echo "::error::gofmt: $unformatted" && exit 1)

      - run: go vet ./...

      - run: go test -race ./...

      # Every platform's sources sit behind build tags, so a host build compiles
      # none of them. Without this a mistake surfaces days later in an app build
      # on a machine nobody is looking at.
      - name: Type-check the other platforms
        run: |
          for target in android/arm64 ios/arm64 linux/amd64 windows/amd64; do
            echo "==> $target"
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./internal/...
          done

  android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build libcaelo.so for every ABI
        run: ./deploy/android/build-so.sh build/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

      - uses: actions/upload-artifact@v7
        with:
          name: core-android
          path: core/build/android/*/libcaelo.so
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Universal. A dylib built only for the host would fail to load on the
      # other architecture, and it would fail at the user rather than here.
      - name: Build the macOS library and commands
        run: make macos probe tun helper

      - name: Build the iOS xcframework
        run: make ios

      - uses: actions/upload-artifact@v7
        with:
          name: core-macos
          path: |
            core/build/libcaelo.dylib
            core/build/libcaelo.h
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: core-ios
          path: core/build/ios/caelo.xcframework
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - run: make linux

      - uses: actions/upload-artifact@v7
        with:
          name: core-linux
          path: core/build/libcaelo.so
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      # Built directly rather than through the Makefile: Windows runners have
      # no make, and installing one to run a single command is a dependency
      # bought for nothing.
      - name: Build caelo.dll
        shell: bash
        run: |
          version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          CGO_ENABLED=1 go build -buildmode=c-shared \
            -ldflags "-X github.com/TeamGDB/Caelo/core/internal/version.Version=$version" \
            -o build/caelo.dll ./libcaelo

      - uses: actions/upload-artifact@v7
        with:
          name: core-windows
          path: |
            core/build/caelo.dll
            core/build/caelo.h
          if-no-files-found: error
