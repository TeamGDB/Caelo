name: Package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# The shapes people install, built so that the packaging itself is exercised on
# every run rather than discovered to be broken on the day of a release.
#
# macOS is signed and notarised here (#42); the system extension will not load
# without it, so there is no useful unsigned build to fall back to.
#
# Windows ships unsigned on purpose -- it works without a certificate, and the
# reasoning is written down in docs/signing.md rather than left to be guessed
# from its absence. The release notes below say so to whoever downloads it.

env:
  # Whether a tagged run may produce a release people can find and a manifest
  # their installed copies will read.
  #
  # Not the same question as "is this run a tag": both have to be true, and the
  # two are combined once, in the gate step, so the release and the manifest
  # cannot disagree. A served manifest pointing into a draft release offers
  # every installed copy a download that 404s, because GitHub does not serve a
  # draft's assets.
  #
  # A dispatch run stays a draft regardless, which is what makes it safe to look
  # at a release before there is one to make.
  PUBLISH_TAGGED_RELEASES: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.pick.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: |
          # A tag when there is one, otherwise something ordered and unique so
          # that two dispatch runs never produce identically named packages.
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0+${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

  android:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - run: flutter pub get

      # No fallback to the debug key here, unlike a local build. Android refuses
      # an update across a change of signing key, so a debug-signed APK that
      # reached a release page would strand everyone who installed it: uninstall
      # and reinstall, with nothing we could do about it afterwards.
      - name: Put the release keystore on the runner
        env:
          CAELO_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [[ -z "$CAELO_KEYSTORE_BASE64" ]]; then
            echo "::error::No Android release keystore. See docs/signing.md; #42."
            exit 1
          fi
          base64 --decode <<< "$CAELO_KEYSTORE_BASE64" > "$RUNNER_TEMP/caelo-release.jks"
          # A keystore is a PKCS#12 container: DER, so it starts with 0x30. The
          # same check the macOS certificate gets, for the same reason -- a
          # mangled secret otherwise fails much later, describing something else.
          if [[ "$(head -c 1 "$RUNNER_TEMP/caelo-release.jks" | xxd -p)" != "30" ]]; then
            echo "::error::ANDROID_KEYSTORE did not decode to a keystore."
            exit 1
          fi

      - run: ./scripts/build-android.sh release
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          CAELO_KEYSTORE: ${{ runner.temp }}/caelo-release.jks
          CAELO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAELO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAELO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # The bundle as well as the APKs: stores want one, everyone else wants
      # the other, and sideloading wants the universal APK because whoever
      # passes the file on does not know what is at the far end.
      - run: flutter build appbundle --release
        env:
          CAELO_KEYSTORE: ${{ runner.temp }}/caelo-release.jks
          CAELO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAELO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAELO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Proof, not assumption. A build that quietly fell back to the debug key
      # produces a perfectly good APK that must never be published, and the
      # difference is invisible until somebody tries to update.
      - name: Prove it was signed with the release key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*release.apk; do
            dn=$("$APKSIGNER" verify --print-certs "$apk" | grep -i "certificate DN:" || true)
            # Absence is a failure, not a pass. If apksigner's output ever stops
            # matching this, a check that quietly found nothing would report
            # every debug-signed build as fine -- which is the only outcome this
            # step exists to prevent.
            if [[ -z "$dn" ]]; then
              echo "::error::could not read a signing certificate from $(basename "$apk")"
              exit 1
            fi
            echo "$(basename "$apk"): $dn"
            if grep -qi "Android Debug" <<< "$dn"; then
              echo "::error::$(basename "$apk") is signed with the debug key"
              exit 1
            fi
          done

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/caelo-release.jks"

      - name: Collect
        env:
          # In the name because minSdk is 24, and someone deciding whether a
          # file is worth downloading onto an old phone should not have to
          # install it to find out.
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*release.apk; do
            name=$(basename "$apk" .apk); name=${name#app-}; name=${name%-release}
            [[ "$name" == "release" ]] && name=universal
            cp "$apk" "dist/Caelo-$VERSION-android7+-$name.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/Caelo-$VERSION-android.aab"
          ls -1sh dist

      - uses: actions/upload-artifact@v7
        with: { name: android-apk-arm64-v8a, path: dist/*arm64-v8a.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: android-apk-armeabi-v7a, path: dist/*armeabi-v7a.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: android-apk-x86_64, path: dist/*x86_64.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: android-apk-universal, path: dist/*universal.apk, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: android-aab, path: dist/*.aab, if-no-files-found: error }

  linux:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install the desktop and packaging toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev rpm ruby-dev build-essential libfuse2
          sudo gem install --no-document fpm
          curl -sSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool

      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - run: flutter pub get
      - run: ./scripts/build-linux.sh release
      - run: ./packaging/linux/package.sh x64 "${{ needs.version.outputs.value }}"

      - uses: actions/upload-artifact@v7
        with: { name: linux-x64-deb, path: dist/*.deb, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: linux-x64-rpm, path: dist/*.rpm, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: linux-x64-appimage, path: dist/*.AppImage, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: linux-x64-tarball, path: dist/*.tar.gz, if-no-files-found: error }

  macos:
    runs-on: macos-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - run: flutter pub get

      # The project signs manually against a named profile, which is right on a
      # machine that has one and is why this job failed from the day the system
      # extension landed until the day somebody ran it (#55). There is
      # deliberately no unsigned fallback: an extension will not load without a
      # signature anyway, and a workaround that quietly produced unsigned builds
      # would still be here, unnoticed, long after signing became real.
      - name: Put the signing identity on the runner
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILES: ${{ secrets.MACOS_PROVISIONING_PROFILES }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE_P12" ]]; then
            echo "::error::No macOS signing identity. This job needs the secrets listed in docs/signing.md; see #42."
            exit 1
          fi
          ./scripts/ci-macos-signing.sh setup

      - run: ./scripts/build-macos.sh release

      # The application is notarised and stapled before it is wrapped, so that
      # the copy inside the disk image carries its own ticket and validates on a
      # machine that is offline the first time it is opened.
      - name: Notarise the app
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: ./scripts/notarize-macos.sh

      - run: ./packaging/macos/package.sh "${{ needs.version.outputs.value }}"

      - name: Notarise the disk image
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          ./scripts/notarize-macos.sh dist/*.dmg

      # Proof rather than assumption. Both of these have passed while the thing
      # they describe was wrong: stapler validates a ticket that was attached to
      # a bundle nobody checked, and spctl is the only one that answers the
      # question a person's machine will ask.
      - name: Prove it will open on a machine that has never seen it
        run: |
          hdiutil attach -quiet -nobrowse -mountpoint /tmp/caelo dist/*.dmg
          spctl --assess --type execute --verbose=2 /tmp/caelo/Caelo.app
          xcrun stapler validate /tmp/caelo/Caelo.app
          hdiutil detach -quiet /tmp/caelo

      - uses: actions/upload-artifact@v7
        with: { name: macos-dmg, path: dist/*.dmg, if-no-files-found: error }

      - name: Take the signing material back off the runner
        if: always()
        run: ./scripts/ci-macos-signing.sh teardown

  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - run: flutter pub get
      - name: Build
        shell: bash
        run: ./scripts/build-windows.sh release
      - name: Package
        shell: bash
        run: ./packaging/windows/package.sh "${{ needs.version.outputs.value }}"

      - uses: actions/upload-artifact@v7
        with: { name: windows-x64-setup, path: dist/*setup.exe, if-no-files-found: error }
      - uses: actions/upload-artifact@v7
        with: { name: windows-x64-portable, path: dist/*portable.zip, if-no-files-found: error }

  publish:
    # Actions artifacts are always zipped, one archive per artifact. A release
    # is the only place these appear as the files themselves, downloadable one
    # at a time by anyone with the link -- which is what every other client in
    # this space ships and what people expect to find.
    #
    # Runs on dispatch as well as on tags, so the release page can be looked at
    # before there is anything to release. A dispatch run stays a draft.
    needs: [version, android, linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publishable: ${{ steps.gate.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: incoming
          merge-multiple: true

      - name: Build the update manifests
        env:
          # Absent until the key exists. The script says so and carries on, so
          # that the shape of the manifest is exercised on every run rather than
          # first attempted on the day it has to work.
          APPCAST_KEY: ${{ secrets.APPCAST_ED25519_KEY }}
        run: |
          ./scripts/make-appcast.sh "${{ needs.version.outputs.value }}" incoming pages
          cp pages/appcast.xml pages/latest.json incoming/

      # Uploaded whether or not it will be served, so that a draft run can be
      # read by a person before anything is promised to a machine.
      - uses: actions/upload-artifact@v7
        with: { name: update-manifests, path: pages/*, if-no-files-found: error }

      - id: gate
        # Decided once and used for both the release and the manifest. An
        # earlier version read the flag directly for `draft:`, which meant
        # clearing it would have published every dispatch run as a real release
        # under a tag like v0.1.0+12.
        run: |
          if [[ "$PUBLISH_TAGGED_RELEASES" == "true" && "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Draft only: manifests built but not served."
          fi

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ steps.gate.outputs.value != 'true' }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.version.outputs.value) }}
          name: Caelo ${{ needs.version.outputs.value }}
          files: incoming/*
          body: |
            | Platform | File |
            | --- | --- |
            | Android | one APK per architecture, or the universal one if unsure |
            | Linux | `.deb`, `.rpm`, AppImage, or the tarball |
            | macOS | `.dmg` — drag Caelo into Applications |
            | Windows | installer, or the portable zip to run from a stick |

            ### Windows will warn, and it is right to

            The Windows build is not signed with an Authenticode certificate, so
            SmartScreen shows "Windows protected your PC" and the elevation
            prompt says the publisher is unknown. Everything works — the driver
            Caelo uses carries its own Microsoft-attested signature — but Windows
            has no way to tell who built this installer.

            Do not take that on faith. Every file here is listed in
            [`latest.json`](https://teamgdb.github.io/Caelo/latest.json) with its
            SHA-256, so you can check what you downloaded is what we published:

            ```
            shasum -a 256 Caelo-*-windows-x64-setup.exe
            ```

            macOS is signed with a Developer ID and notarised by Apple, and opens
            without ceremony.

  pages:
    # Serving the manifest is a separate job from writing it, because it happens
    # only when there is something to serve. It runs after publish rather than
    # beside it: the manifest names files that must already be downloadable, and
    # the ordering is the whole guarantee.
    needs: publish
    if: needs.publish.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with: { name: update-manifests, path: pages }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: pages }
      - id: deploy
        uses: actions/deploy-pages@v4
