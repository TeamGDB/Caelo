name: Flutter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyse-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify the generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated \
            || (echo "::error::lib/l10n/generated is stale — run 'flutter gen-l10n' and commit the result" && exit 1)

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The core lives in caelo-core and is built by its own pipeline, so the
      # APK from here carries no libcaelo.so: the interface runs and reports
      # that the core is not there. Building a complete APK needs the two
      # repositories to reach each other, which needs a token.
      - run: flutter build apk --debug

      # Debug signing. A build check, not a release, and it must never be
      # handed to anyone as one — hence the name.
      - uses: actions/upload-artifact@v4
        with:
          name: caelo-debug-apk-no-core
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Without the core bundled, for the same reason as the APK above.
      - run: flutter build macos --debug

      - name: Compress the bundle
        run: |
          cd build/macos/Build/Products/Debug
          zip -qry Caelo-debug.zip Caelo.app

      - uses: actions/upload-artifact@v4
        with:
          name: caelo-debug-macos-no-core
          path: build/macos/Build/Products/Debug/Caelo-debug.zip
          if-no-files-found: error
