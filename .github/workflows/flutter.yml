name: Flutter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyse-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify the generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated \
            || (echo "::error::lib/l10n/generated is stale — run 'flutter gen-l10n' and commit the result" && exit 1)

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

  # Every platform builds the core first and then the app, through the same
  # scripts a person would run. A pipeline that is green on a path nobody walks
  # is one that will eventually be green on a broken build.
  #
  # Every artifact here is debug-signed or unsigned. None is a release and none
  # may be handed to anyone as one.

  android:
    runs-on: ubuntu-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: ./scripts/build-android.sh debug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

      # An APK without the core is a screenshot of an application, so this
      # fails outright rather than shipping one.
      - name: Verify the core is in the APK
        run: unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -q 'lib/arm64-v8a/libcaelo.so'

      - uses: actions/upload-artifact@v7
        with:
          name: caelo-android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Unsigned. The app now embeds a system extension, and signing one needs
      # a Developer ID certificate this pipeline has no business holding. What
      # is being checked is that it compiles and that the core ends up inside.
      - run: ./scripts/build-macos.sh debug
        env:
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""

      - name: Verify the core is in the bundle, and compress it
        run: |
          cd build/macos/Build/Products/Debug
          test -f Caelo.app/Contents/Frameworks/libcaelo.dylib
          zip -qry Caelo-debug.zip Caelo.app

      - uses: actions/upload-artifact@v7
        with:
          name: caelo-macos
          path: build/macos/Build/Products/Debug/Caelo-debug.zip
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build the core for iOS
        run: |
          ./core/deploy/ios/build-xcframework.sh
          mkdir -p ios/Frameworks
          cp -R core/build/ios/caelo.xcframework ios/Frameworks/

      # Unsigned: signing needs a certificate this pipeline has no business
      # holding. What is being checked is that it links and that the core's
      # symbols survive that linking.
      - run: flutter build ios --release --no-codesign

      - name: Verify the core is linked and reachable
        run: |
          nm -g build/ios/iphoneos/Runner.app/Runner | grep -q '_caelo_version' \
            || (echo "::error::the core is linked but its symbols are not exported — check -force_load and -export_dynamic" && exit 1)

      - name: Compress
        run: cd build/ios/iphoneos && zip -qry Runner-unsigned.zip Runner.app

      - uses: actions/upload-artifact@v7
        with:
          name: caelo-ios-unsigned
          path: build/ios/iphoneos/Runner-unsigned.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Install the desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: ./scripts/build-linux.sh debug

      - name: Verify the core is in the bundle
        run: test -f build/linux/x64/debug/bundle/lib/libcaelo.so

      - name: Compress
        run: cd build/linux/x64/debug && tar czf caelo-linux.tar.gz bundle

      - uses: actions/upload-artifact@v7
        with:
          name: caelo-linux
          path: build/linux/x64/debug/caelo-linux.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build the core and the app
        shell: bash
        run: ./scripts/build-windows.sh debug

      - name: Verify the core is beside the executable
        shell: bash
        run: test -f build/windows/x64/runner/Debug/caelo.dll

      - uses: actions/upload-artifact@v7
        with:
          name: caelo-windows
          path: build/windows/x64/runner/Debug
          if-no-files-found: error
