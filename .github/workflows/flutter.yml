name: Flutter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyse-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify the generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated \
            || (echo "::error::lib/l10n/generated is stale — run 'flutter gen-l10n' and commit the result" && exit 1)

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # The same script developers run, so CI cannot pass on a path nobody
      # uses. It builds the core for every ABI into jniLibs, then the APK.
      - run: ./scripts/build-android.sh debug
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}

      # An APK without the core is a screenshot of an application, so failing
      # here is correct: nothing downstream should get one by accident.
      - name: Verify the core is in the APK
        run: unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -q 'lib/arm64-v8a/libcaelo.so'

      # Debug signing. A build check, not a release, and it must never be
      # handed to anyone as one.
      - uses: actions/upload-artifact@v4
        with:
          name: caelo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Builds the core, builds the app, and puts the dylib inside the bundle
      # with its install name rewritten and an ad-hoc signature.
      - run: ./scripts/build-macos.sh debug

      - name: Verify the core is in the bundle, and compress it
        run: |
          cd build/macos/Build/Products/Debug
          test -f Caelo.app/Contents/Frameworks/libcaelo.dylib
          zip -qry Caelo-debug.zip Caelo.app

      # Ad-hoc signed only. Release builds are signed with a Developer ID and
      # notarised during packaging, not here.
      - uses: actions/upload-artifact@v4
        with:
          name: caelo-debug-macos
          path: build/macos/Build/Products/Debug/Caelo-debug.zip
          if-no-files-found: error
