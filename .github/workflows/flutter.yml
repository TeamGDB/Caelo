name: Flutter

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyse-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify the generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n/generated \
            || (echo "::error::lib/l10n/generated is stale — run 'flutter gen-l10n' and commit the result" && exit 1)

      - run: dart format --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug signing only. This is a build check, not a release artifact, and
      # it must never be handed to anyone as one.
      - run: flutter build apk --debug

  build-macos:
    runs-on: macos-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Without the core bundled: caelo-core lives in its own repository and
      # its own pipeline. This checks that the application itself still builds.
      - run: flutter build macos --debug
