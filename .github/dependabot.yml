version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"

  - package-ecosystem: gradle
    directory: "/apps/android"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(android)"
